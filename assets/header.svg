<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Rohit Shinde: Data Analyst | SQL | Python | Power BI | Data Visualization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#132a47"/>
      <stop offset="1" stop-color="#1d3d63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#3b9eff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b9eff"/>
      <stop offset="0.6" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#f2c811"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b9eff"/>
      <stop offset="1" stop-color="#3b9eff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c811" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f2c811" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:'Cascadia Code',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
    .fade{opacity:0;animation:fade .9s ease-out forwards}
    @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes grow{to{transform:scaleY(1)}}
    .line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s ease-out 1.3s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .pulse{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 2.2s ease-out 3s infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(4);opacity:0}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .live{animation:live 1.6s ease-in-out infinite}
    @keyframes live{50%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){
      .fade,.bar,.line,.pulse,.blink,.live{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
      .pulse{opacity:0}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- Intro -->
    <g class="sans">
      <text x="70" y="92" class="fade" style="animation-delay:.1s" fill="#7dd3fc" font-size="14" font-weight="600" letter-spacing="5">HELLO, I'M</text>
      <text x="67" y="152" class="fade" style="animation-delay:.25s" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="1">ROHIT SHINDE</text>
      <text x="70" y="194" class="fade" style="animation-delay:.45s" fill="url(#accent)" font-size="28" font-weight="700">Data Analyst</text>
      <text x="70" y="226" class="fade" style="animation-delay:.6s" fill="#c7d5e8" font-size="17">SQL  ·  Python  ·  Power BI  ·  Data Visualization</text>

      <g class="fade" style="animation-delay:.8s" font-size="13" font-weight="600" text-anchor="middle">
        <rect x="70" y="248" width="218" height="28" rx="14" fill="#3b9eff" fill-opacity="0.14" stroke="#3b9eff" stroke-opacity="0.5"/>
        <text x="179" y="267" fill="#9ccfff">MSc Data Analytics · 2026</text>
        <rect x="300" y="248" width="150" height="28" rx="14" fill="#3b9eff" fill-opacity="0.14" stroke="#3b9eff" stroke-opacity="0.5"/>
        <text x="375" y="267" fill="#9ccfff">Berlin, Germany</text>
        <rect x="462" y="248" width="132" height="28" rx="14" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.55"/>
        <circle class="live" cx="482" cy="262" r="4" fill="#34d399"/>
        <text x="535" y="267" fill="#86efac">Open to work</text>
      </g>
    </g>

    <text x="70" y="316" class="mono fade" style="animation-delay:1s" fill="#5f7ea3" font-size="13">&gt; SELECT insight FROM raw_data WHERE decision = 'better';<tspan class="blink" fill="#7dd3fc"> ▌</tspan></text>

    <!-- Mini dashboard -->
    <g class="fade" style="animation-delay:.3s">
      <rect x="700" y="46" width="440" height="252" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="724" cy="70" r="5" fill="#ff5f57"/>
      <circle cx="742" cy="70" r="5" fill="#febc2e"/>
      <circle cx="760" cy="70" r="5" fill="#28c840"/>
      <text x="780" y="74" class="mono" fill="#8aa4c4" font-size="12">kpi_dashboard.pbix</text>
      <line x1="700" y1="88" x2="1140" y2="88" stroke="#ffffff" stroke-opacity="0.08"/>
      <g stroke="#ffffff" stroke-opacity="0.06">
        <line x1="728" y1="152" x2="1112" y2="152"/>
        <line x1="728" y1="212" x2="1112" y2="212"/>
      </g>
      <line x1="728" y1="272" x2="1112" y2="272" stroke="#8aa4c4" stroke-opacity="0.5"/>
    </g>

    <g>
      <rect class="bar" style="animation-delay:.50s" x="735"  y="226" width="34" height="46"  rx="4" fill="url(#bar)"/>
      <rect class="bar" style="animation-delay:.62s" x="789"  y="206" width="34" height="66"  rx="4" fill="url(#bar)"/>
      <rect class="bar" style="animation-delay:.74s" x="843"  y="214" width="34" height="58"  rx="4" fill="url(#bar)"/>
      <rect class="bar" style="animation-delay:.86s" x="897"  y="184" width="34" height="88"  rx="4" fill="url(#bar)"/>
      <rect class="bar" style="animation-delay:.98s" x="951"  y="192" width="34" height="80"  rx="4" fill="url(#bar)"/>
      <rect class="bar" style="animation-delay:1.10s" x="1005" y="164" width="34" height="108" rx="4" fill="url(#bar)"/>
      <rect class="bar" style="animation-delay:1.22s" x="1059" y="144" width="34" height="128" rx="4" fill="url(#bar)"/>
    </g>

    <path class="fade" style="animation-delay:2.4s" d="M752 212 L806 192 L860 200 L914 170 L968 178 L1022 150 L1076 130 L1076 272 L752 272 Z" fill="url(#area)"/>
    <path class="line" d="M752 212 L806 192 L860 200 L914 170 L968 178 L1022 150 L1076 130" fill="none" stroke="#f2c811" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="1076" cy="130" r="5" fill="#f2c811"/>
    <circle class="fade" style="animation-delay:2.8s" cx="1076" cy="130" r="5" fill="#f2c811" stroke="#0a1628" stroke-width="2"/>

    <g class="fade" style="animation-delay:3s">
      <rect x="990" y="98" width="120" height="24" rx="6" fill="#f2c811"/>
      <text x="1050" y="115" class="mono" text-anchor="middle" fill="#0a1628" font-size="12" font-weight="700">reliability +25%</text>
    </g>

    <rect y="336" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
